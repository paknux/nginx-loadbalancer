<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced System Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
        }

        /* Top Bar Info */
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 25px 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            border-bottom: 5px solid #38bdf8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .info-item { text-align: left; }
        .label { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; font-weight: bold; }
        .val { display: block; font-size: 1.6rem; color: #38bdf8; font-weight: 800; }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: #161e2d;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.3s;
        }

        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #94a3b8; font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 1px; }

        /* Data Besar */
        .big-number {
            font-size: 4.5rem; /* Ukuran Mantap */
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }

        .capacity-text {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.1);
            padding: 5px 15px;
            border-radius: 10px;
            display: inline-block;
        }

        .net-stats {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .down { color: #10b981; }
        .up { color: #ef4444; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div class="info-item">
            <span class="label">HOSTNAME</span>
            <span class="val" id="hostname">---</span>
        </div>
        <div class="info-item">
            <span class="label">OPERATING SYSTEM</span>
            <span class="val" id="os">---</span>
        </div>
        <div class="info-item">
            <span class="label">IP ADDRESS</span>
            <span class="val" id="ip">0.0.0.0</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>CPU LOAD</h3>
            <span class="big-number" id="cpu">0%</span>
        </div>

        <div class="card">
            <h3>RAM USAGE</h3>
            <span class="big-number" id="ramPct">0%</span>
            <div class="capacity-text" id="ramCap">0GB / 0GB</div>
        </div>

        <div class="card">
            <h3>DISK SPACE</h3>
            <span class="big-number" id="diskPct">0%</span>
            <div class="capacity-text" id="diskCap">0GB / 0GB</div>
        </div>

        <div class="card">
            <h3>NETWORK</h3>
            <div class="net-stats down">⬇ <span id="netIn">0 KB/s</span></div>
            <div class="net-stats up">⬆ <span id="netOut">0 KB/s</span></div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const response = await fetch('/api/info');
                const data = await response.json();

                // Identitas
                document.getElementById('hostname').innerText = data.hostname;
                document.getElementById('os').innerText = data.os;
                document.getElementById('ip').innerText = data.ip;

                // Stats Utama
                document.getElementById('cpu').innerText = data.cpu;
                document.getElementById('ramPct').innerText = data.ramPct;
                document.getElementById('ramCap').innerText = data.ramCap;
                document.getElementById('diskPct').innerText = data.diskPct;
                document.getElementById('diskCap').innerText = data.diskCap;
                document.getElementById('netIn').innerText = data.netIn;
                document.getElementById('netOut').innerText = data.netOut;
            } catch (err) {
                console.error("Gagal mengambil data sistem.");
            }
        }

        // Jalankan setiap 2 detik
        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>
</html>
